version: 1

models:
  - name: google_sheets
    database: DEV_SILVER_DB
    schema: google_sheets
    tables:
      - name: budget
        columns:
          - name: _silver
            data_tests:
              - unique
              - not_null
              - relationships:
                  arguments:
                    to: ref('products')
                    field: product_id
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    max_value: "num_orders"
      - name: quantity_budgeted
        data_test:
          - positive_values